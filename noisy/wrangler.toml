# للعرض والتوثيق فقط — النشر والتعديل يتمّان من لوحة Cloudflare.
# لا توجد هنا أي أسرار؛ المفاتيح محفوظة كـ Secrets داخل Cloudflare.
name = "bardy-noisy"
main = "noisy.js"
compatibility_date = "2026-01-01"

[ai]
binding = "AI"            # Workers AI لإجابات بردي

# Secrets المطلوبة (تُضاف من Settings ← Variables and Secrets):
#   - API_KEY
#   - FIRECRAWL_API_KEY
#   - NEWS_API_URL
#   - NEWS_API_KEY
